<script>
// ---- Catálogo (copia de src/modules/tramitacion/domain/catalogo.ts) ---------
const DEPENDENCIAS = {

const ESTADOS = {

  "02": { nombre: "Pago observado", dep: "mesa-partes", tipo: "observacion" },
  "03": { nombre: "Pago conforme (derivado a Coordinación)", dep: "mesa-partes", tipo: "conforme" },
  "04": { nombre: "Requisitos observados", dep: "coordinacion", tipo: "observacion" },

  "06": { nombre: "Docente supervisor asignado", dep: "coordinacion", tipo: "conforme" },
  "07": { nombre: "En supervisión", dep: "docente", tipo: "proceso" },
  "08": { nombre: "Supervisión observada", dep: "docente", tipo: "observacion" },
  "09": { nombre: "Supervisión aprobada", dep: "docente", tipo: "conforme" },
  "10": { nombre: "Constancia lista para recoger", dep: "bienestar", tipo: "final" },
};
/** Etiqueta corta de cada estado (la `etiqueta` del catálogo). */
const ETIQUETAS = {
  "01": "Recibido", "02": "Observado", "03": "Conforme", "04": "Observado", "05": "Conforme",
  "06": "Docente asignado", "07": "En supervisión", "08": "Observado", "09": "Aprobado", "10": "Constancia lista",
};
const TRANSICIONES = {
  "01": ["02", "03"], "02": ["03"], "03": ["04", "05"], "04": ["05"], "05": ["06"],
  "06": ["07"], "07": ["08", "09"], "08": ["07"], "09": ["10"], "10": [],

const MAXIMO = 150;

/** Lo que la oficina puede registrar desde un estado (se deriva del catálogo). */
const acciones = (codigo, oficina) => TRANSICIONES[codigo].filter((d) => ESTADOS[d].dep === oficina);

/** Ayuda bajo cada opción: qué pasa al registrarla. La clave es "desde→hacia". */
const AYUDA = {

  "02→03": "El estudiante entregó el pago correcto. El expediente pasa a Coordinación.",

  "04→05": "El estudiante completó lo que faltaba. Después asignarás al Docente Supervisor.",
  "05→06": "El expediente pasa al Docente Supervisor que elijas.",
  "06→07": "Registra que empezaste a supervisar al estudiante.",
  "07→08": "El expediente queda contigo hasta que el estudiante corrija lo indicado.",
  "07→09": "El expediente pasa a Bienestar y Empleabilidad.",
  "08→07": "El estudiante entregó la corrección. La supervisión continúa.",
  "09→10": "El estudiante recibirá el aviso para recoger su constancia en físico.",
};

// ---- Datos ficticios --------------------------------------------------------
const AHORA = new Date(2026, 9, 22, 10, 30);
let minutosExtra = 0;
const ahoraMismo = () => new Date(AHORA.getTime() + ++minutosExtra * 60000);

const CARRERA = "Desarrollo de Sistemas de Información";
const OFICINAS = {

};
const DOCENTES = [

  { id: "d2", nombre: "Ing. M. Vargas", activo: true },
  { id: "d4", nombre: "Lic. E. Castillo", activo: true },
  { id: "d3", nombre: "Lic. C. Salazar", activo: false },
];
const ESTUDIANTES = [
  { id: "e1", nombres: "Giancarlos", apellidos: "Ormeño", tipo: "DNI", numero: "71234568", institucional: "gormeno@iestpgildaballivian.edu.pe", personal: "" },
  { id: "e2", nombres: "Valeria", apellidos: "Quispe Huamán", tipo: "DNI", numero: "72458190", institucional: "", personal: "valeria.quispe@gmail.com" },

  { id: "e5", nombres: "José Carlos", apellidos: "Mendoza Ríos", tipo: "DNI", numero: "71876520", institucional: "jmendoza@iestpgildaballivian.edu.pe", personal: "" },

  { id: "e9", nombres: "Diego Armando", apellidos: "Salas Pinto", tipo: "DNI", numero: "72987601", institucional: "dsalas@iestpgildaballivian.edu.pe", personal: "" },
  { id: "e10", nombres: "Carmen Julia", apellidos: "Ccori Mamani", tipo: "DNI", numero: "73654120", institucional: "cccori@iestpgildaballivian.edu.pe", personal: "" },
  { id: "e11", nombres: "Jorge Luis", apellidos: "Vílchez Arana", tipo: "DNI", numero: "71230987", institucional: "jvilchez@iestpgildaballivian.edu.pe", personal: "" },
];

// [id, estudiante, módulo, docente, recorrido: [código, días atrás, hora, nota?]]
const RECORRIDOS = [
  ["x1", "e1", "III", null, [["01", 3, "09:12"], ["03", 2, "11:40"]]],
  ["x12", "e1", "I", "d1", [["01", 60, "09:00"], ["03", 59, "10:10"], ["05", 55, "15:30"], ["06", 54, "09:20"], ["07", 50, "08:15"], ["09", 20, "11:00"], ["10", 15, "12:45", "Recógela en la oficina de Bienestar, de 8:00 a. m. a 1:00 p. m."]]],
  ["x2", "e2", "I", null, [["01", 0, "08:47"]]],
  ["x3", "e3", "II", null, [["01", 4, "10:05"], ["02", 4, "10:20", "El voucher no corresponde al concepto de EFSRT. Canjea el pago correcto en Tesorería."]]],
  ["x4", "e4", "I", null, [["01", 8, "09:30"], ["03", 7, "15:10"], ["05", 1, "16:20"]]],
  ["x5", "e5", "II", "d1", [["01", 12, "08:55"], ["03", 11, "10:00"], ["05", 6, "11:15"], ["06", 5, "09:40"]]],
  ["x6", "e6", "I", "d1", [["01", 20, "09:10"], ["03", 19, "09:45"], ["05", 14, "10:30"], ["06", 12, "16:00"], ["07", 9, "08:30"]]],
  ["x7", "e7", "III", "d1", [["01", 30, "11:00"], ["03", 29, "12:00"], ["05", 25, "10:00"], ["06", 24, "09:00"], ["07", 20, "08:00"], ["08", 2, "17:05", "Falta la firma del jefe inmediato en la ficha de evaluación."]]],
  ["x8", "e8", "II", "d2", [["01", 40, "09:00"], ["03", 39, "10:00"], ["05", 35, "11:00"], ["06", 34, "09:00"], ["07", 30, "08:00"], ["09", 1, "12:30"]]],
  ["x9", "e9", "I", "d2", [["01", 70, "09:00"], ["03", 69, "10:00"], ["05", 65, "11:00"], ["06", 64, "09:00"], ["07", 60, "08:00"], ["09", 30, "10:00"], ["10", 28, "09:30"]]],
  ["x10", "e10", "II", null, [["01", 6, "09:25"], ["03", 5, "10:40"], ["04", 3, "15:50", "Falta el plan de actividades firmado por la empresa."]]],
  ["x11", "e11", "III", "d3", [["01", 26, "09:00"], ["03", 25, "10:00"], ["05", 22, "11:00"], ["06", 21, "09:30"], ["07", 18, "08:10"]]],
];

const nombreDocente = (id) => DOCENTES.find((d) => d.id === id)?.nombre ?? "—";
function fechaDe(diasAtras, hm) {
  const [h, m] = hm.split(":").map(Number);
  const f = new Date(AHORA);
  f.setDate(f.getDate() - diasAtras);
  f.setHours(h, m, 0, 0);
  return f;
}
const EXPEDIENTES = RECORRIDOS.map(([id, est, mod, docente, ruta]) => {
  const x = { id, est, mod, docente, historial: [] };
  let anterior = null;
  for (const [codigo, dias, hm, nota] of ruta) {
    const dep = ESTADOS[codigo].dep;
    x.historial.push({
      tipo: "estado", anterior, codigo, fecha: fechaDe(dias, hm), nota: nota ?? "",
      actor: dep === "docente" ? nombreDocente(docente) : OFICINAS[dep].actor,
    });
    anterior = codigo;
  }
  return x;
});

// ---- Estado de la pantalla --------------------------------------------------
const S = {
  oficina: "coordinacion", vista: "pc", conflicto: false,
  pantalla: "bandeja", pestana: "atender", consulta: "", expId: null,
  hacia: null, nota: "", docente: "", aviso: null,
  reasignar: false, nuevoDocente: "", motivoReasignar: "",
  campana: false, nuevos: [],
  rec: { paso: "buscar", consulta: "", estId: null, modulo: null, nota: "", error: "" },
  nuevo: { tipo: "DNI", numero: "", nombres: "", apellidos: "", institucional: "", personal: "", intento: false },
};

// ---- Utilidades -------------------------------------------------------------
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const MESES = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "set.", "oct.", "nov.", "dic."];
function diasDesde(f) {
  const a = new Date(AHORA); a.setHours(0, 0, 0, 0);
  const b = new Date(f); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 864e5);
}
const hora = (f) => f.toTimeString().slice(0, 5);
function dia(f) {
  const d = diasDesde(f);
  return d === 0 ? "Hoy" : d === 1 ? "Ayer" : `${String(f.getDate()).padStart(2, "0")} ${MESES[f.getMonth()]}`;
}
const momento = (f) => `${dia(f)} · ${hora(f)}`;
const normalizar = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const est = (id) => ESTUDIANTES.find((e) => e.id === id);
const exp = (id) => EXPEDIENTES.find((x) => x.id === id);
const nombreCompleto = (e) => `${e.nombres} ${e.apellidos}`;
const estadosDe = (x) => x.historial.filter((h) => h.tipo === "estado");
const estadoActual = (x) => estadosDe(x).at(-1).codigo;
const ultimaFecha = (x) => x.historial.at(-1).fecha;
const iniciales = (n) => n.replace(/^(Mg|Lic|Ing)\.\s*/, "").split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
/** "Patricia" para "Lic. Patricia Gutiérrez"; el nombre completo si solo hay una inicial ("Mg. R. Paredes"). */
function saludo(usuario) {
  const nombre = usuario.replace(/^(Mg|Lic|Ing)\.\s*/, "").split(" ")[0];
  return nombre.length <= 2 ? usuario : nombre;
}
const docenteInactivo = (x) => x.docente && !DOCENTES.find((d) => d.id === x.docente).activo && ["06", "07", "08"].includes(estadoActual(x));

function visibles() {
  const docenteId = OFICINAS[S.oficina].docenteId;
  return EXPEDIENTES.filter((x) => !docenteId || x.docente === docenteId);
}
function tieneObservaciones(oficina) {
  return Object.values(ESTADOS).some((e) => e.dep === oficina && e.tipo === "observacion");
}
function enPestana(x, pestana) {
  const codigo = estadoActual(x);
  const deMiOficina = ESTADOS[codigo].dep === S.oficina;
  const observado = ESTADOS[codigo].tipo === "observacion";
  if (pestana === "atender") {
    return (acciones(codigo, S.oficina).length > 0 && !observado) || (S.oficina === "coordinacion" && docenteInactivo(x));
  }
  if (pestana === "esperando") return deMiOficina && observado;
  return true;
}
// ---- Campana de notificaciones (Fase 10) -------------------------------------------
// Una oficina recibe un aviso cuando un expediente "pasa" a ella (D56): Coordinación
// con el 03, Bienestar con el 09. El docente, cuando lo asignan (06) o lo reasignan.
// Mesa de Partes no tiene campana: nada le llega de otra oficina. Coordinación y
// Bienestar leen como oficina; el docente, como persona. Al abrir la campana se
// marcan como leídos.
const LLEGA_CON = { coordinacion: "03", bienestar: "09" };
const tieneCampana = (oficina) => oficina === "docente" || oficina in LLEGA_CON;
/** Hasta cuándo leyó cada oficina (ficticio: así hay avisos sin leer al empezar). */
const VISTO = { coordinacion: fechaDe(6, "00:00"), bienestar: fechaDe(2, "00:00"), docente: fechaDe(6, "00:00") };
const MAXIMO_AVISOS = 20;

function avisosDe(oficina) {
  const lista = [];
  for (const x of EXPEDIENTES) {
    const e = est(x.est);
    const quien = `${nombreCompleto(e)}`;
    for (const h of x.historial) {
      if (oficina === "docente") {
        const yo = OFICINAS.docente.usuario;
        if (h.tipo === "estado" && h.codigo === "06" && (h.docente ?? nombreDocente(x.docente)) === yo) {
          lista.push({ expId: x.id, fecha: h.fecha, titulo: `Te asignaron a ${quien}`, detalle: `Módulo ${x.mod} · Coordinación de Carrera`, codigo: "06" });
        }
        if (h.tipo === "reasignacion" && h.a === yo) {
          lista.push({ expId: x.id, fecha: h.fecha, titulo: `Te asignaron a ${quien}`, detalle: `Módulo ${x.mod} · Reemplazas a ${h.de}`, codigo: estadoActual(x) });
        }
      } else if (h.tipo === "estado" && h.codigo === LLEGA_CON[oficina]) {
        lista.push({ expId: x.id, fecha: h.fecha, titulo: `Llegó el expediente de ${quien}`, detalle: `Módulo ${x.mod} · ${ESTADOS[h.codigo].nombre.replace(/ \(.*\)$/, "")}`, codigo: h.codigo });
      }
    }
  }
  return lista.sort((a, b) => b.fecha - a.fecha).slice(0, MAXIMO_AVISOS);
}
const sinLeer = (oficina) => avisosDe(oficina).filter((a) => a.fecha > VISTO[oficina]).length;
const claveAviso = (a) => `${a.expId}-${a.fecha.getTime()}`;

// En celular el panel ocupa el ancho bajo la barra superior; en PC cuelga de la campana.
function campana() {
  const movil = S.vista === "celular";
  if (!tieneCampana(S.oficina)) return "";
  const n = sinLeer(S.oficina);
  const avisos = avisosDe(S.oficina);
  const subtitulo = S.oficina === "docente" ? "Los expedientes que Coordinación te asignó" : "Los expedientes que llegaron a tu oficina";
  const item = (a) => {
    const nuevo = S.nuevos.includes(claveAviso(a));
    return `<li><button type="button" onclick="irAviso('${a.expId}')"
        class="flex w-full items-start gap-3 px-4 py-3 text-left hover:bg-bg ${nuevo ? "bg-navy-tint/40" : ""}">
      <span class="mt-1.5 size-2 shrink-0 rounded-full ${nuevo ? "bg-navy" : "bg-transparent"}" aria-hidden="true"></span>
      <span class="flex min-w-0 grow flex-col gap-0.5">
        <span class="text-[13px] leading-snug ${nuevo ? "font-semibold" : "font-medium"}">${esc(a.titulo)}${nuevo ? '<span class="sr-only"> (nuevo)</span>' : ""}</span>
        <span class="truncate text-xs text-muted">${esc(a.detalle)}</span>
        <span class="font-mono text-[11px] text-muted">${momento(a.fecha)}</span>
      </span>
    </button></li>`;
  };
  const panel = !S.campana ? "" : `
    <div id="panel-campana" role="region" aria-label="Notificaciones"
      class="absolute z-30 flex ${movil ? "top-full right-3 left-3 mt-1" : "top-[calc(100%+8px)] right-0 w-[350px]"} flex-col overflow-hidden rounded-2xl border border-line bg-white text-ink shadow-xl">
      <div class="flex items-start justify-between gap-2 border-b border-line px-4 py-3">
        <div class="flex flex-col gap-0.5"><span class="font-display text-[15px] font-extrabold">Notificaciones</span>
          <span class="text-xs text-muted">${subtitulo}</span></div>
        <button type="button" onclick="cerrarCampana()" aria-label="Cerrar notificaciones" class="-mt-1 -mr-2 flex size-11 shrink-0 items-center justify-center rounded-xl text-muted hover:bg-bg">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      ${avisos.length === 0
        ? `<p class="px-4 py-8 text-center text-sm text-muted">Aún no tienes notificaciones. Aquí verás ${S.oficina === "docente" ? "los expedientes que te asignen" : "los expedientes que lleguen a tu oficina"}.</p>`
        : `<ul class="max-h-[420px] divide-y divide-line overflow-y-auto">${avisos.map(item).join("")}</ul>
           ${avisos.length >= MAXIMO_AVISOS ? `<p class="border-t border-line px-4 py-2.5 text-[11px] text-muted">Se muestran las últimas ${MAXIMO_AVISOS}.</p>` : ""}`}
    </div>`;
  return `<div data-campana class="${movil ? "" : "relative"}">
    <button type="button" onclick="${S.campana ? "cerrarCampana()" : "abrirCampana()"}" aria-expanded="${S.campana}" aria-controls="panel-campana"
      aria-label="${n > 0 ? `Notificaciones, ${n} sin leer` : "Notificaciones"}"
      class="relative flex size-11 items-center justify-center rounded-[14px] border border-line bg-white text-ink hover:bg-bg">
      ${icono("campana", 20)}
      ${n > 0 ? `<span class="absolute top-1.5 right-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-warn px-1 font-mono text-[10px] font-semibold text-white" aria-hidden="true">${n}</span>` : ""}
    </button>${panel}
  </div>`;
}

function coincide(e, consulta) {
  const q = normalizar(consulta);
  if (!q) return true;
  if (/^[0-9a-z]+$/.test(q) && /\d/.test(q)) return e.numero.toLowerCase().startsWith(q);
  return normalizar(nombreCompleto(e)).includes(q) || normalizar(`${e.apellidos} ${e.nombres}`).includes(q);
}

const CHIP = { proceso: "bg-neutral-bg text-text-soft", conforme: "bg-ok-bg text-ok", observado: "bg-warn text-white", subsanado: "bg-warn-bg text-warn-text" };
const chipCodigo = (codigo, tono) =>

function tonoActual(codigo) {

}
const PILDORA = { "en-curso": "bg-navy-tint text-navy", observado: "bg-warn-bg text-warn-text", listo: "bg-ok-bg text-ok", neutro: "bg-neutral-bg text-text-soft" };
const pildora = (texto, tono) => `<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold whitespace-nowrap ${PILDORA[tono]}">${esc(texto)}</span>`;
function pildoraUbicacion(codigo) {

}
const boton = (texto, accion, { variante = "primario", deshabilitado = false, ancho = "", icono: ic = "" } = {}) => {

// ---- Bandeja ------------------------------------------------------------------------
function pestanas() {
  const lista = [{ id: "atender", texto: "Por atender" }];
  if (tieneObservaciones(S.oficina)) lista.push({ id: "esperando", texto: "Observados" });

/** Estudiantes con al menos un expediente visible, del cambio más reciente al más antiguo. */
function estudiantesVisibles() {
  const ids = [...new Set(visibles().map((x) => x.est))];
  const ultimo = (id) => Math.max(...visibles().filter((x) => x.est === id).map((x) => ultimaFecha(x).getTime()));
  return ids.map(est).sort((a, b) => ultimo(b.id) - ultimo(a.id));
}
const cuentaPestana = (id) => (id === "todos" ? estudiantesVisibles().length : visibles().filter((x) => enPestana(x, id)).length);

// "Estudiantes": una fila por estudiante y una celda por módulo (cada módulo es su propio expediente).
function tablaEstudiantes() {
  const lista = estudiantesVisibles().filter((e) => coincide(e, S.consulta));
  if (lista.length === 0) return vacio();
  const columnas = "@5xl:grid-cols-[minmax(0,1.4fr)_repeat(3,minmax(0,1fr))]";
  return `<div class="hidden gap-3 border-b border-line px-5 py-3 text-[11px] font-semibold tracking-wide text-muted uppercase @5xl:grid ${columnas}">

    </li>`).join("")}</ul>`;

// Celular: casilla vertical con "Mód. I" arriba. PC: celda de la tabla (el encabezado ya dice el módulo).
function celdaModulo(e, m) {
  const x = EXPEDIENTES.find((y) => y.est === e.id && y.mod === m);
  const rotulo = `<span class="font-mono text-[10px] font-semibold whitespace-nowrap text-muted @5xl:hidden">Mód. ${m}</span>`;

}
function bandeja() {

      ${boton("Cambiar", "S.rec.paso='buscar';S.rec.modulo=null;render()", { variante: "texto" })}</div>`)}
    ${tarjeta(`<fieldset class="flex flex-col gap-4 p-5"><legend class="sr-only">Módulo</legend>
      <span class="font-display text-base font-extrabold">¿De qué módulo es la carpeta?</span>
      <div class="flex flex-col gap-2">
      ${["I", "II", "III"].map((m) => {
        const x = EXPEDIENTES.find((y) => y.est === e.id && y.mod === m);
        const marcado = r.modulo === m;
        const primeroLibre = m === ["I", "II", "III"].find((n) => !EXPEDIENTES.some((y) => y.est === e.id && y.mod === n));
        const errorModulo = S.intento && !r.modulo;
        if (x) {
          const c = estadoActual(x);
          return `<div class="flex min-h-11 items-start gap-3 rounded-xl border border-line bg-bg p-3.5 text-muted">
            <input type="radio" disabled class="mt-1 size-4" /><span class="flex flex-col gap-1"><span class="text-sm font-semibold">Módulo ${m}</span>
            <span class="flex items-start gap-2 text-xs">Ya tiene expediente: ${chipCodigo(c, tonoActual(c))} ${ESTADOS[c].nombre}</span></span></div>`;
        }
        return `<label class="flex min-h-11 cursor-pointer items-center gap-3 rounded-xl border p-3.5 ${marcado ? "border-navy bg-navy-tint/50" : errorModulo ? "border-warn" : "border-line hover:bg-bg"}">
          <input type="radio" name="modulo" ${primeroLibre ? 'id="opcion-modulo"' : ""} ${atributosError("opcion-modulo", errorModulo ? "x" : "")} ${marcado ? "checked" : ""} onchange="S.rec.modulo='${m}';render()" class="size-4 accent-navy" />
          <span class="text-sm font-semibold">Módulo ${m}</span></label>`;
      }).join("")}
      ${mensajeError("opcion-modulo", S.intento && !r.modulo ? "Elige el módulo de la carpeta." : "")}
      </div>
      ${areaTexto("nota-recepcion", r.nota, "S.rec.nota=this.value;render()", "Nota (opcional)", "Por ejemplo: entregó la carpeta sin la copia del DNI.")}
      ${boton("Registrar recepción", "registrarRecepcion()", { ancho: "w-full" })}
      <p class="text-[11px] leading-normal text-muted">Después revisarás el pago desde el expediente.</p>
    </fieldset>`)}`;
}

// ---- Acciones ----------------------------------------------------------------------------
function limpiarFormulario() {
  Object.assign(S, { hacia: null, nota: "", docente: "", reasignar: false, nuevoDocente: "", motivoReasignar: "", intento: false });
}
function cambiarOficina(o) {
  limpiarFormulario();
  Object.assign(S, { oficina: o, pantalla: "bandeja", pestana: "atender", consulta: "", aviso: null, campana: false, nuevos: [] });
  render();
}
// Al abrir se marcan como leídos; mientras está abierta se resaltan los que eran nuevos.
function abrirCampana() {
  const visto = VISTO[S.oficina];
  S.nuevos = avisosDe(S.oficina).filter((a) => a.fecha > visto).map(claveAviso);
  VISTO[S.oficina] = ahoraMismo();
  S.campana = true;
  render();
  document.querySelector("#panel-campana button")?.focus();
}
function cerrarCampana() {
  Object.assign(S, { campana: false, nuevos: [] });
  render();
  document.querySelector("[data-campana] > button")?.focus();
}
function irAviso(id) {
  Object.assign(S, { campana: false, nuevos: [] });
  abrir(id);
}
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.campana) cerrarCampana(); });
document.addEventListener("click", (ev) => {
  if (S.campana && !ev.target.closest("[data-campana]")) { Object.assign(S, { campana: false, nuevos: [] }); render(); }
});
function ir(pantalla) {
  limpiarFormulario();
  S.pantalla = pantalla;
  S.aviso = null;
  if (pantalla === "recepcion") S.rec = { paso: "buscar", consulta: "", estId: null, modulo: null, nota: "" };
  render();
  document.getElementById("desplazable")?.scrollTo(0, 0);
}
function abrir(id) {
  limpiarFormulario();
  Object.assign(S, { pantalla: "detalle", expId: id, aviso: null });
  render();
  document.getElementById("desplazable")?.scrollTo(0, 0);
}
function registrar() {
  const x = exp(S.expId);
  const desde = estadoActual(x);
  const errores = erroresAccion(desde);
  if (Object.values(errores).some(Boolean)) {
    S.intento = true;
    render();
    enfocarPrimerError(errores, { hacia: "opcion-hacia", docente: "asignar-docente", nota: "nota" });
    return;
  }
  const hacia = opcionElegida(desde);
  if (S.conflicto) {
    S.aviso = { tipo: "conflicto" };
    render();
    return;
  }
  const entrada = { tipo: "estado", anterior: desde, codigo: hacia, fecha: ahoraMismo(), nota: S.nota.trim(), actor: OFICINAS[S.oficina].actor };
  if (hacia === "06") {
    x.docente = S.docente;
    entrada.docente = nombreDocente(S.docente);
  }
  x.historial.push(entrada);
  const e = est(x.est);
  S.aviso = { tipo: "ok", titulo: `Registraste ${hacia} · ${ESTADOS[hacia].nombre}`, texto: `Le avisamos a ${e.nombres.split(" ")[0]} por correo.` };
  limpiarFormulario();
  render();
}
function cerrarReasignar() {
  Object.assign(S, { reasignar: false, nuevoDocente: "", motivoReasignar: "", intento: false });
  render();
}
function reasignar() {
  const errores = erroresReasignar();
  if (Object.values(errores).some(Boolean)) {
    S.intento = true;
    render();
    enfocarPrimerError(errores, { docente: "reasignar-docente", motivo: "motivo-reasignar" });
    return;
  }
  const x = exp(S.expId);
  x.historial.push({ tipo: "reasignacion", fecha: ahoraMismo(), actor: OFICINAS.coordinacion.actor, de: nombreDocente(x.docente), a: nombreDocente(S.nuevoDocente), nota: S.motivoReasignar.trim() });
  x.docente = S.nuevoDocente;
  S.aviso = { tipo: "ok", titulo: `Docente Supervisor: ${nombreDocente(x.docente)}`, texto: "Desde ahora este expediente aparece en su bandeja." };
  cerrarReasignar();
}
function elegirEstudiante(id) {
  Object.assign(S.rec, { paso: "modulo", estId: id, modulo: null });
  S.intento = false;
  render();
}
function guardarNuevo() {
  S.nuevo.intento = true;
  const errores = erroresNuevo();
  if (Object.keys(errores).length > 0) {
    render();
    enfocarPrimerError(errores, { numero: "nuevo-numero", nombres: "nuevo-nombres", apellidos: "nuevo-apellidos", institucional: "nuevo-institucional", personal: "nuevo-personal" });
    return;
  }
  const n = S.nuevo;
  const e = { id: `e${ESTUDIANTES.length + 1}`, nombres: n.nombres.trim(), apellidos: n.apellidos.trim(), tipo: n.tipo, numero: n.numero.trim(), institucional: n.institucional.trim(), personal: n.personal.trim() };
  ESTUDIANTES.push(e);
  S.nuevo = { tipo: "DNI", numero: "", nombres: "", apellidos: "", institucional: "", personal: "", intento: false };
  elegirEstudiante(e.id);
}
function registrarRecepcion() {
  const r = S.rec;
  if (!r.modulo) {
    S.intento = true;
    render();
    document.getElementById("opcion-modulo")?.focus();
    return;
  }
  const x = { id: `x${EXPEDIENTES.length + 100}`, est: r.estId, mod: r.modulo, docente: null,
    historial: [{ tipo: "estado", anterior: null, codigo: "01", fecha: ahoraMismo(), nota: r.nota.trim(), actor: OFICINAS["mesa-partes"].actor }] };
  EXPEDIENTES.push(x);
  abrir(x.id);
  S.aviso = { tipo: "ok", titulo: "Registraste 01 · Expediente recibido", texto: "Ahora revisa el pago y registra si está conforme u observado." };
  render();
}

// ---- Dibujo (conserva el foco y el cursor al volver a dibujar) ------------------------
function render() {
  const activo = document.activeElement;
  const foco = activo && activo.id ? { id: activo.id, inicio: activo.selectionStart, fin: activo.selectionEnd } : null;
  const desplazamiento = document.getElementById("desplazable")?.scrollTop ?? 0;
  document.getElementById("controles").innerHTML = controles();
  document.getElementById("marco").innerHTML = marco();
  const desplazable = document.getElementById("desplazable");
  if (desplazable) desplazable.scrollTop = desplazamiento;
  if (foco) {
    const el = document.getElementById(foco.id);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (foco.inicio != null) el.setSelectionRange(foco.inicio, foco.fin); } catch {}
    }
  }
}

// Pantalla inicial desde la dirección, p. ej. Oficinas.html#oficina=docente&vista=celular&exp=x7
// (también pantalla=recepcion y consulta=… para la búsqueda de Mesa de Partes).
const inicial = new URLSearchParams(location.hash.slice(1));
if (DEPENDENCIAS[inicial.get("oficina")]) S.oficina = inicial.get("oficina");
if (["pc", "celular"].includes(inicial.get("vista"))) S.vista = inicial.get("vista");
if (exp(inicial.get("exp"))) Object.assign(S, { pantalla: "detalle", expId: inicial.get("exp") });
if (inicial.get("pantalla") === "recepcion") S.pantalla = "recepcion";
if (inicial.get("consulta")) S.rec.consulta = inicial.get("consulta");
if (["atender", "esperando", "todos"].includes(inicial.get("pestana"))) S.pestana = inicial.get("pestana");
// campana=1 abre la campana (p. ej. #oficina=coordinacion&campana=1).
if (inicial.get("campana") && tieneCampana(S.oficina)) abrirCampana();
render();
</script>
